<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Georgia, 'Times New Roman', serif">
  <title>Esbozo de la interfaz · Laberinto de metro (nivel 2)</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d8ccb0" stroke-width="1"/>
    </pattern>
    <pattern id="crowd" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f6d9b8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e07b24" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- Fondo papel -->
  <rect width="960" height="600" fill="#f3ead6"/>

  <!-- Cabecera -->
  <rect x="20" y="16" width="920" height="54" rx="8" fill="#2b2a28"/>
  <text x="40" y="51" font-size="22" fill="#f3ead6" font-weight="bold">Laberinto de metro</text>
  <text x="270" y="50" font-size="16" fill="#d8ccb0">Nivel 2 · Correspondencias</text>
  <text x="760" y="51" font-size="22" fill="#f0b429">★★<tspan fill="#6b665c">★</tspan></text>
  <text x="850" y="50" font-size="18" fill="#f3ead6">🔊</text>
  <text x="890" y="50" font-size="18" fill="#f3ead6">⏸</text>

  <!-- Tablero -->
  <rect x="20" y="86" width="600" height="390" rx="8" fill="url(#grid)" stroke="#8a7d62" stroke-width="2"/>
  <!-- Paredes (bloques) -->
  <g fill="#cfc2a3">
    <rect x="140" y="200" width="320" height="60"/>
    <rect x="140" y="330" width="320" height="120"/>
    <rect x="560" y="330" width="40" height="120"/>
  </g>
  <!-- Túneles sin salida -->
  <g stroke="#8a7d62" stroke-width="10" stroke-dasharray="4 8" stroke-linecap="round" fill="none">
    <path d="M100 410H40"/>
    <path d="M100 160V110H260"/>
    <path d="M520 290H600"/>
  </g>
  <!-- L3 verde -->
  <path d="M100 410V160" stroke="#2f9e44" stroke-width="12" stroke-linecap="round"/>
  <!-- L4 amarilla -->
  <path d="M100 290H520" stroke="#f2b705" stroke-width="12" stroke-linecap="round"/>
  <!-- L5 azul -->
  <path d="M100 160H520V290" stroke="#1c6fc2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hora punta -->
  <rect x="80" y="205" width="40" height="40" fill="url(#crowd)" stroke="#e07b24" stroke-width="2"/>
  <text x="128" y="230" font-size="12" fill="#a8541a">hora punta</text>

  <!-- Estaciones -->
  <g font-size="13" fill="#2b2a28">
    <!-- Catalunya (salida) -->
    <circle cx="100" cy="410" r="14" fill="#fff" stroke="#2b2a28" stroke-width="4"/>
    <text x="96" y="415" font-size="13" font-weight="bold">S</text>
    <text x="122" y="458">Catalunya</text>
    <!-- Passeig de Gràcia (correspondencia + trozo) -->
    <circle cx="100" cy="290" r="15" fill="#fff" stroke="#2b2a28" stroke-width="3"/>
    <circle cx="100" cy="290" r="9" fill="#fff" stroke="#2b2a28" stroke-width="3"/>
    <text x="160" y="314">Passeig de Gràcia</text>
    <!-- Diagonal (correspondencia + trozo) -->
    <circle cx="100" cy="160" r="15" fill="#fff" stroke="#2b2a28" stroke-width="3"/>
    <circle cx="100" cy="160" r="9" fill="#fff" stroke="#2b2a28" stroke-width="3"/>
    <text x="122" y="150">Diagonal</text>
    <!-- Girona (cerrada) -->
    <circle cx="320" cy="290" r="14" fill="#fff" stroke="#b42318" stroke-width="4"/>
    <path d="M310 280l20 20M330 280l-20 20" stroke="#b42318" stroke-width="4"/>
    <text x="290" y="318" fill="#b42318">Girona · obras</text>
    <!-- Verdaguer (destino) -->
    <circle cx="520" cy="290" r="15" fill="#2b2a28" stroke="#2b2a28" stroke-width="3"/>
    <text x="514" y="295" font-size="13" font-weight="bold" fill="#f3ead6">D</text>
    <text x="478" y="318">Verdaguer</text>
  </g>

  <!-- Trozos del plano -->
  <g>
    <rect x="128" y="265" width="22" height="18" fill="#efe2bf" stroke="#6b5a32" stroke-width="2" transform="rotate(-8 139 274)"/>
    <path d="M132 270h14M132 276h14M139 266v16" stroke="#6b5a32" stroke-width="1" transform="rotate(-8 139 274)"/>
    <rect x="128" y="168" width="22" height="18" fill="#efe2bf" stroke="#6b5a32" stroke-width="2" transform="rotate(6 139 177)"/>
    <path d="M132 173h14M132 179h14M139 169v16" stroke="#6b5a32" stroke-width="1" transform="rotate(6 139 177)"/>
  </g>

  <!-- Ficha del jugador (sombrero de Cerdà) -->
  <g transform="translate(100 350)">
    <circle r="15" fill="#2b2a28"/>
    <rect x="-8" y="-10" width="16" height="12" rx="2" fill="#f3ead6"/>
    <rect x="-12" y="1" width="24" height="4" rx="2" fill="#f3ead6"/>
  </g>

  <!-- Selector de línea (ejemplo en una correspondencia) -->
  <g transform="translate(180 360)">
    <rect width="230" height="70" rx="8" fill="#fff" stroke="#2b2a28" stroke-width="2"/>
    <text x="12" y="22" font-size="13" fill="#2b2a28">Correspondencia: ¿qué línea coges?</text>
    <rect x="12" y="34" width="56" height="26" rx="13" fill="#2f9e44"/>
    <text x="28" y="52" font-size="14" fill="#fff" font-weight="bold">L3</text>
    <rect x="80" y="34" width="56" height="26" rx="13" fill="#f2b705"/>
    <text x="96" y="52" font-size="14" fill="#2b2a28" font-weight="bold">L4</text>
    <rect x="148" y="34" width="70" height="26" rx="13" fill="#fff" stroke="#8a7d62"/>
    <text x="158" y="52" font-size="13" fill="#6b665c">Cancelar</text>
  </g>
  <path d="M180 380L116 300" stroke="#2b2a28" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Panel lateral -->
  <rect x="640" y="86" width="300" height="390" rx="8" fill="#fbf6ea" stroke="#8a7d62" stroke-width="2"/>
  <text x="660" y="118" font-size="13" fill="#6b665c" letter-spacing="2">MISIÓN</text>
  <text x="660" y="144" font-size="18" fill="#2b2a28" font-weight="bold">Catalunya → Verdaguer</text>
  <text x="660" y="166" font-size="13" fill="#6b665c">Recoge los trozos del plano por el camino</text>

  <text x="660" y="204" font-size="13" fill="#6b665c" letter-spacing="2">TROZOS DEL PLANO</text>
  <rect x="660" y="214" width="34" height="28" fill="#efe2bf" stroke="#6b5a32" stroke-width="2"/>
  <rect x="702" y="214" width="34" height="28" fill="none" stroke="#8a7d62" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="748" y="234" font-size="15" fill="#2b2a28">1 / 2</text>

  <g font-size="15" fill="#2b2a28">
    <text x="660" y="280">⏱ Tiempo</text><text x="850" y="280" font-weight="bold">01:48</text>
    <text x="660" y="306">👣 Movimientos</text><text x="868" y="306" font-weight="bold">23</text>
    <text x="660" y="332">🏆 Puntos</text><text x="850" y="332" font-weight="bold">1.240</text>
  </g>

  <!-- Leyenda de líneas -->
  <g font-size="12" fill="#2b2a28">
    <rect x="660" y="350" width="26" height="8" rx="4" fill="#2f9e44"/><text x="692" y="358">L3</text>
    <rect x="726" y="350" width="26" height="8" rx="4" fill="#f2b705"/><text x="758" y="358">L4</text>
    <rect x="792" y="350" width="26" height="8" rx="4" fill="#1c6fc2"/><text x="824" y="358">L5</text>
  </g>

  <rect x="660" y="380" width="260" height="40" rx="20" fill="#2b2a28"/>
  <text x="726" y="406" font-size="15" fill="#f3ead6">🗺 Mirar el plano (−50)</text>
  <text x="660" y="446" font-size="12" fill="#6b665c">Enseña los nombres ocultos durante 3 s</text>

  <!-- Barra inferior: ¿Sabías que…? -->
  <rect x="20" y="492" width="600" height="88" rx="8" fill="#fff8e1" stroke="#f0b429" stroke-width="2"/>
  <text x="40" y="522" font-size="15" fill="#2b2a28" font-weight="bold">💡 ¿Sabías que…?</text>
  <text x="40" y="548" font-size="14" fill="#4a463e">Aviso corto con una curiosidad cuando pasas por una estación.</text>
  <text x="40" y="568" font-size="12" fill="#6b665c">Desaparece solo a los 5 s y no para el juego.</text>

  <!-- Cruceta táctil -->
  <g transform="translate(790 536)" fill="#fbf6ea" stroke="#2b2a28" stroke-width="2">
    <rect x="-18" y="-46" width="36" height="28" rx="6"/>
    <rect x="-18" y="18" width="36" height="28" rx="6"/>
    <rect x="-62" y="-14" width="36" height="28" rx="6"/>
    <rect x="26" y="-14" width="36" height="28" rx="6"/>
    <g fill="#2b2a28" stroke="none" font-size="14">
      <text x="-6" y="-26">▲</text><text x="-6" y="38">▼</text>
      <text x="-50" y="6">◀</text><text x="38" y="6">▶</text>
    </g>
  </g>
  <text x="640" y="590" font-size="11" fill="#6b665c">Cruceta solo en el móvil · en el ordenador, flechas o WASD</text>
</svg>
